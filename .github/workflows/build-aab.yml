name: Build CalcNova AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract CalcNova project
        run: |
          rm -rf CalcNovaAndroid
          mkdir CalcNovaAndroid
          unzip -o CalcNovaAndroid-ReadyProject.zip -d CalcNovaAndroid

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin targets
        working-directory: CalcNovaAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = 'android {\n'
          insert = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''

          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace(marker, insert, 1)

          if 'kotlinOptions' not in s:
              s += '''

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(s)
          PY

          echo "Final app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Build Android App Bundle
        working-directory: CalcNovaAndroid
        run: |
          gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CalcNova-AAB
          path: CalcNovaAndroid/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
